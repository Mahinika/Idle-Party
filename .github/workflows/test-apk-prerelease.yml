# Sideload QA APKs for com.idleparty.app.test. Not for Play.
# workflow_dispatch or push a test-* tag. Release v* builds stay in build-apk.yml.

name: Test APK prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag (example test-pr40)'
        required: true
        type: string
      ref:
        description: 'Branch or commit to build'
        required: true
        type: string
        default: main
      title:
        description: 'Release title'
        required: false
        type: string
        default: 'Test APK (not for Play)'
      notes:
        description: 'Release notes (optional; default mentions both APKs)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'test-*'

permissions:
  contents: write

jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Patch Android for test package
        run: python3 tool/ci/patch_android_test_apk.py apply

      - name: Build test APKs (arm64 phone + x86_64 emulator)
        env:
          IDLE_TEST_PACKAGE: '1'
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --dart-define=GIT_SHA="${{ github.sha }}"
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk idle-party-test-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk idle-party-test-x86_64.apk

      - name: Restore Android tree
        if: always()
        run: python3 tool/ci/patch_android_test_apk.py restore

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ inputs.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "title=Test APK ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          title="${{ steps.meta.outputs.title }}"
          case "$tag" in
            test-* ) ;;
            *) echo "Tag must start with test- (got $tag)." >&2; exit 1 ;;
          esac
          if [ -z "$NOTES_INPUT" ]; then
            notes="Sideload only. Not for Play. Debug-signed.

          idle-party-test-arm64.apk — phones (arm64), including Samsung A56
          idle-party-test-x86_64.apk — x86_64 Android emulators

          Package com.idleparty.app.test, label Idle Party Test. Saves are separate from the Play install."
          else
            notes="$NOTES_INPUT"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" idle-party-test-arm64.apk idle-party-test-x86_64.apk --clobber
            echo "Updated assets on existing prerelease $tag."
            exit 0
          fi
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --prerelease \
            --latest=false \
            --title "$title" \
            --notes "$notes" \
            idle-party-test-arm64.apk \
            idle-party-test-x86_64.apk
