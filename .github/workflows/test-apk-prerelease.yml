# Sideload QA APKs for com.idleparty.app.test. Not for Play.
# workflow_dispatch or push a test-* tag. Release v* builds stay in build-apk.yml.

name: Test APK prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag (example test-pr40)'
        required: true
        type: string
      ref:
        description: 'Branch or commit to build'
        required: true
        type: string
        default: main
      title:
        description: 'Release title'
        required: false
        type: string
        default: 'Test APK (not for Play)'
      notes:
        description: 'Release notes (optional; default mentions both APKs)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'test-*'

permissions:
  contents: write

jobs:
  test-apk:
    runs-on: ubuntu-latest
    env:
      # Step `if:` cannot read `secrets`; read this env copy instead.
      FAD_CREDENTIALS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-28.2.13676358-${{ runner.os }}-v1
          restore-keys: |
            ndk-28.2.13676358-${{ runner.os }}-

      - name: Install Android NDK (Flutter pin)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          bash tool/ci/install_ndk_ci.sh 28.2.13676358

      - name: Sync Firebase Android config (optional CI token)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: bash tool/ci/firebase_sync_test_apk_config.sh

      - name: Firebase config for test package
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 tool/ci/ensure_google_services_test_apk.py

      - name: Patch Android for test package
        run: python3 tool/ci/patch_android_test_apk.py apply

      # Dedicated test key for com.idleparty.app.test only. Never the Play keystore.
      # If these secrets are missing, the APK stays debug-signed (previous behavior).
      - name: Decode test keystore (optional)
        id: test_sign
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_KEYSTORE_BASE64}" ] || [ -z "${TEST_KEYSTORE_PASSWORD}" ] \
            || [ -z "${TEST_KEY_ALIAS}" ] || [ -z "${TEST_KEY_PASSWORD}" ]; then
            echo "No test keystore secrets; test APKs will use debug signing."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$TEST_KEYSTORE_BASE64" | base64 -d > android/test-upload-keystore.jks
          test -s android/test-upload-keystore.jks
          python3 tool/ci/write_test_key_properties.py
          echo "signed=test" >> "$GITHUB_OUTPUT"

      - name: Build test APKs (arm64 phone + x86_64 emulator)
        env:
          IDLE_TEST_PACKAGE: '1'
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --dart-define=GIT_SHA="${{ github.sha }}"
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk idle-party-test-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk idle-party-test-x86_64.apk

      - name: Restore Android tree
        if: always()
        run: python3 tool/ci/patch_android_test_apk.py restore

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ inputs.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "title=Test APK ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          title="${{ steps.meta.outputs.title }}"
          case "$tag" in
            test-* ) ;;
            *) echo "Tag must start with test- (got $tag)." >&2; exit 1 ;;
          esac
          if [ -z "$NOTES_INPUT" ]; then
            if [ "${{ steps.test_sign.outputs.signed }}" = "test" ]; then
              sign_line="Signed with the dedicated test key, not the Play key. First install of this key needs one uninstall of the old debug-signed Idle Party Test app (com.idleparty.app.test only). The Play app is not affected."
            else
              sign_line="Debug-signed."
            fi
            notes="Sideload only. Not for Play. ${sign_line}

          idle-party-test-arm64.apk — phones (arm64), including Samsung A56
          idle-party-test-x86_64.apk — x86_64 Android emulators

          Package com.idleparty.app.test, label Idle Party Test. Saves are separate from the Play install."
          else
            notes="$NOTES_INPUT"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" idle-party-test-arm64.apk idle-party-test-x86_64.apk --clobber
            echo "Updated assets on existing prerelease $tag."
            exit 0
          fi
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --prerelease \
            --latest=false \
            --title "$title" \
            --notes "$notes" \
            idle-party-test-arm64.apk \
            idle-party-test-x86_64.apk

      # No-op until FIREBASE_APP_DISTRIBUTION_CREDENTIALS is set.
      # App Distribution is free on Spark. Do not use the Play service account.
      # Robert must: create a service account with role "Firebase App Distribution
      # Admin", put its JSON key in that secret, and in Firebase Console >
      # App Distribution for "Idle Party Test" create testers group "robert"
      # with only his email.
      - name: Skip Firebase App Distribution when unconfigured
        if: ${{ env.FAD_CREDENTIALS == '' }}
        run: echo "No FIREBASE_APP_DISTRIBUTION_CREDENTIALS; skipping App Distribution."

      - name: Upload arm64 test APK to Firebase App Distribution
        if: ${{ env.FAD_CREDENTIALS != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: 1:900067828121:android:a612149094a9324290b308
          serviceCredentialsFileContent: ${{ env.FAD_CREDENTIALS }}
          groups: robert
          file: idle-party-test-arm64.apk
          releaseNotes: "Idle Party Test arm64, not for Play. ${{ github.sha }}"
