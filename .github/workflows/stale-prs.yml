# Mark inactive pull requests stale after 14 days, then close them
# 7 days later. Issues are untouched.

name: Stale pull requests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-message: >
            This pull request has had no activity for 14 days and is being marked stale.
            It will be closed after 7 more days without activity.
          close-pr-message: >
            Closing this pull request. It was stale, then had no activity for 7 days.
            Reopen or open a fresh PR when you are ready to continue.
          operations-per-run: 60