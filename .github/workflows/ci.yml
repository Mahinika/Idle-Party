name: CI

on:
  push:
    branches: [main, master, 'cursor/**', 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-main:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md on PRs to main
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # pull_request checkout is the merge commit. Diff that tree if the
          # head SHA is not readable as its own commit in this clone.
          changed="$(git diff --name-only "$base" "$head" 2>/dev/null || true)"
          if ! printf '%s\n' "$changed" | grep -qx CHANGELOG.md; then
            changed="$(git diff --name-only "$base" HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated."
          else
            echo "Pull requests targeting main must update CHANGELOG.md with a short entry." >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter pin
        id: flutter-pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python deps (paper-doll facit)
        run: python -m pip install --quiet pillow

      - name: Paper-doll classify + facit
        run: python tool/paper_doll_classify.py && python tool/check_paper_doll_facit.py

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test --no-fatal-infos

      - name: Test
        # Long Monte-Carlo sims are tagged `sim` and run in sim-nightly.yml.
        # The live-light balance gate is untagged and still blocks merges.
        run: flutter test --exclude-tags sim

  # Compiles the Play snapshot channel. Does not assemble or upload an APK.
  compile-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read Flutter pin
        id: flutter-pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Android platform
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sm"
          yes | "$sm" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sm" --sdk_root="$sdk" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

      - name: Dependencies
        run: flutter pub get

      - name: Local SDK paths
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$sdk"
          test -n "$FLUTTER_ROOT"
          echo "sdk.dir=$sdk" >> android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compile debug Kotlin
        working-directory: android
        run: gradle :app:compileDebugKotlin --no-daemon
