name: CI

on:
  push:
    branches: [main, master, 'cursor/**', 'release/**']
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test --no-fatal-infos

      - name: Test
        # Long Monte-Carlo sims are tagged `sim` and run in sim-nightly.yml.
        # The live-light balance gate is untagged and still blocks merges.
        run: flutter test --exclude-tags sim
